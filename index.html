<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hochsitze Thuine</title>
<meta name="theme-color" content="#1f4a24">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://server.arcgisonline.com https://tile.openstreetmap.org https://sgx.geodatenzentrum.de; font-src 'self' data:; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://server.arcgisonline.com https://tile.openstreetmap.org https://sgx.geodatenzentrum.de; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hochsitze">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css?v=1.9.4">
<link rel="stylesheet" href="style.css?v=1.0.0">
</head>
<body>
<header class="topbar">
  <img src="icons/logo.png" alt="Jagdgemeinschaft Thuine" class="topbar-logo">
  <div class="topbar-title">
    <span class="eyebrow">Jagdgemeinschaft Thuine</span>
    <h1>Hochsitze</h1>
  </div>
  <button class="icon-btn" id="refreshBtn" aria-label="Aktualisieren" title="Aktualisieren">
    <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
  </button>
  <button class="icon-btn" id="settingsBtn" aria-label="Einstellungen" title="Einstellungen">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
  </button>
</header>

<div id="banner" class="banner" hidden></div>

<main id="main">
  <section id="view-karte" class="view" data-view="karte">
    <div id="map" class="map" aria-label="Karte der Hochsitze"></div>
    <div class="map-ctl map-ctl-tr">
      <button class="map-btn" id="layerBtn" aria-label="Kartenart wechseln" title="Kartenart">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
      </button>
      <button class="map-btn" id="histBtn" aria-label="Alte Standorte zeigen" title="Alte Standorte">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button class="map-btn" id="fitBtn" aria-label="Alle Hochsitze zeigen" title="Alle zeigen">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
    <div class="map-ctl map-ctl-br">
      <button class="map-btn big" id="locBtn" aria-label="Mein Standort" title="Mein Standort">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>
    <button class="fab" id="addBtn" hidden>
      <span class="fab-plus">+</span> Hochsitz erfassen
    </button>
    <div id="layerName" class="layer-name" hidden></div>
  </section>
  <section id="view-liste" class="view" data-view="liste" hidden></section>
</main>

<nav class="tabbar" aria-label="Seiten">
  <button class="tab active" data-tab="karte">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2Z"/><path d="M9 4v14M15 6v14"/></svg>
    <span>Karte</span>
  </button>
  <button class="tab" data-tab="liste">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg>
    <span>Liste</span>
  </button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="icon-btn" data-close aria-label="Schließen">✕</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
    <div id="sheetFoot" class="sheet-foot"></div>
  </div>
</div>

<div id="viewer" class="viewer" hidden>
  <div class="viewer-bar">
    <span id="viewerTitle"></span>
    <button class="icon-btn light" id="viewerClose" aria-label="Schließen">✕</button>
  </div>
  <div id="viewerBody" class="viewer-body"></div>
</div>

<div id="lock" class="lock" hidden>
  <form class="lock-box" id="lockForm" autocomplete="off">
    <img src="icons/logo.png" alt="Jagdgemeinschaft Thuine">
    <h2>Hochsitze</h2>
    <p id="lockMsg" class="sub">Bitte das Passwort der Jagdgemeinschaft eingeben.</p>
    <input type="password" id="lockPw" placeholder="Passwort" autocomplete="current-password" aria-label="Passwort">
    <button class="btn block" id="lockBtn" type="submit">Öffnen</button>
    <p class="hint">Das Passwort wird nur einmal pro Gerät abgefragt.</p>
    <button type="button" class="btn ghost" id="lockSettings">Einstellungen</button>
  </form>
</div>

<div id="toast" class="toast" hidden></div>

<script src="vendor/leaflet.js?v=1.9.4"></script>
<script src="app.js?v=1.0.0"></script>
</body>
</html>
